<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Outer Frame -->
  <rect x="50" y="50" width="700" height="500" rx="20" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="10 5" opacity="0.6"/>
  
  <!-- Icon Graphics -->
  <g transform="translate(400, 240)">
    <circle r="70" fill="#10b981" opacity="0.15"/>
    <circle r="50" fill="#10b981" opacity="0.25"/>
    <path d="M-25,-20 L25,-20 L35,25 L-35,25 Z" fill="none" stroke="#10b981" stroke-width="4" stroke-linejoin="round"/>
    <line x1="-35" y1="5" x2="35" y2="5" stroke="#10b981" stroke-width="3"/>
    <circle cx="0" cy="15" r="4" fill="#10b981"/>
  </g>
  
  <text x="400" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">IoT Sensor Device Attachment</text>
  <text x="400" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">ReeferON RF-T100 Temp/GPS Tracker • Antenna Fixed</text>
  <text x="400" y="440" font-family="monospace" font-size="14" fill="#10b981" text-anchor="middle">ReeferON RaaS Asset Verification System</text>
  
  <!-- Watermark Tag -->
  <rect x="70" y="70" width="160" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="150" y="92" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">LIVE VERIFIED</text>
</svg>